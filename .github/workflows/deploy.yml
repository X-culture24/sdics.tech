name: Deploy to Production

on:
  push:
    branches:
      - main
      - production
  workflow_dispatch:

env:
  DEPLOY_HOST: ${{ secrets.DEPLOY_HOST || '206.81.28.246' }}
  DEPLOY_USER: ${{ secrets.DEPLOY_USER || 'root' }}

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SERVER_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ env.DEPLOY_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Deploy to server
        run: |
          ssh -i ~/.ssh/id_rsa ${{ env.DEPLOY_USER }}@${{ env.DEPLOY_HOST }} << 'REMOTESERVER'

          set -e

          DEPLOY_USER_LOCAL=${{ env.DEPLOY_USER }}
          if [ "$DEPLOY_USER_LOCAL" = "root" ]; then
            APP_DIR=/root/sdics.tech
          else
            APP_DIR=/home/$DEPLOY_USER_LOCAL/sdics.tech
          fi
          VENV_DIR=$APP_DIR/venv
          FRONTEND_DIST=/var/www/sdics/frontend
          MOBILE_DIST=/var/www/sdics/mobile

          echo "=== Using APP_DIR: $APP_DIR ==="

          echo "=== Step 1: Prepare directories ==="
          mkdir -p $APP_DIR
          sudo mkdir -p $FRONTEND_DIST $MOBILE_DIST
          sudo chown -R $USER:$USER $FRONTEND_DIST $MOBILE_DIST 2>/dev/null || chown -R $USER:$USER $FRONTEND_DIST $MOBILE_DIST

          cd $APP_DIR || cd / && mkdir -p $APP_DIR && cd $APP_DIR

          echo "=== Step 2: Pull latest code ==="
          if [ -d ".git" ]; then
            echo "Repository exists, pulling latest changes..."
            git fetch origin
            git reset --hard HEAD
            git clean -fd
            BRANCH=${GITHUB_REF_NAME:-main}
            if git show-ref --verify --quiet "refs/remotes/origin/$BRANCH"; then
              git checkout $BRANCH
              git pull origin $BRANCH
            else
              git checkout main
              git pull origin main
            fi
          else
            echo "Cloning fresh repository..."
            rm -rf $APP_DIR/* $APP_DIR/.git 2>/dev/null || true
            git clone --depth 1 https://github.com/${{ github.repository }}.git .
            BRANCH=${GITHUB_REF_NAME:-main}
            git checkout $BRANCH 2>/dev/null || git checkout main
          fi

          echo "=== Step 3: Configure environment ==="
          cat > .env << 'ENVEOF'
          ${{ secrets.ENV_FILE }}
          ENVEOF

          echo "=== Step 4: Setup Python virtual environment ==="
          if [ ! -d "$VENV_DIR" ]; then
            python3 -m venv $VENV_DIR
          fi
          source $VENV_DIR/bin/activate
          pip install --upgrade pip
          pip install -r requirements.txt

          echo "=== Step 5: Run Django migrations ==="
          python manage.py migrate --noinput

          echo "=== Step 6: Collect static files ==="
          mkdir -p staticfiles media logs
          python manage.py collectstatic --noinput

          echo "=== Step 7: Create admin user if needed ==="
          python manage.py create_admin 2>/dev/null || echo "Admin user already exists or command skipped"

          echo "=== Step 8: Build frontend (main dashboard) ==="
          cd frontend
          npm ci
          npm run build
          rm -rf $FRONTEND_DIST/*
          cp -a dist/. $FRONTEND_DIST/
          cd ..

          echo "=== Step 9: Build officer mobile frontend ==="
          cd frontend-mobile
          npm ci --legacy-peer-deps
          npm run build
          rm -rf $MOBILE_DIST/*
          cp -a dist/. $MOBILE_DIST/
          cd ..

          echo "=== Step 10: Copy nginx config ==="
          sed "s|__APP_DIR__|$APP_DIR|g" nginx.conf > /tmp/sdics-nginx.conf
          sudo cp -f /tmp/sdics-nginx.conf /etc/nginx/sites-available/sdics.tech.conf 2>/dev/null || cp -f /tmp/sdics-nginx.conf /etc/nginx/sites-available/sdics.tech.conf
          sudo ln -sf /etc/nginx/sites-available/sdics.tech.conf /etc/nginx/sites-enabled/sdics.tech.conf 2>/dev/null || ln -sf /etc/nginx/sites-available/sdics.tech.conf /etc/nginx/sites-enabled/sdics.tech.conf
          sudo rm -f /etc/nginx/sites-enabled/default 2>/dev/null || rm -f /etc/nginx/sites-enabled/default
          rm -f /tmp/sdics-nginx.conf

          echo "=== Step 11: Test nginx config ==="
          sudo nginx -t 2>/dev/null || nginx -t

          echo "=== Step 12: Setup systemd services ==="
          export USER=$DEPLOY_USER_LOCAL APP_DIR VENV_DIR
          TMP_SERVICE=/tmp/sdics-services.tmp
          for svc in sdics-gunicorn sdics-daphne sdics-celery-worker sdics-celery-beat; do
            envsubst '$USER $APP_DIR $VENV_DIR' < $APP_DIR/scripts/systemd/$svc.service > $TMP_SERVICE
            sudo cp $TMP_SERVICE /etc/systemd/system/$svc.service 2>/dev/null || cp $TMP_SERVICE /etc/systemd/system/$svc.service
          done
          rm -f $TMP_SERVICE

          echo "=== Step 13: Reload systemd and restart services ==="
          sudo systemctl daemon-reload 2>/dev/null || systemctl daemon-reload
          sudo systemctl enable sdics-gunicorn sdics-daphne sdics-celery-worker sdics-celery-beat 2>/dev/null || systemctl enable sdics-gunicorn sdics-daphne sdics-celery-worker sdics-celery-beat 2>/dev/null || true
          sudo systemctl restart sdics-gunicorn 2>/dev/null || systemctl restart sdics-gunicorn 2>/dev/null || true
          sudo systemctl restart sdics-daphne 2>/dev/null || systemctl restart sdics-daphne 2>/dev/null || true
          sudo systemctl restart sdics-celery-worker 2>/dev/null || systemctl restart sdics-celery-worker 2>/dev/null || true
          sudo systemctl restart sdics-celery-beat 2>/dev/null || systemctl restart sdics-celery-beat 2>/dev/null || true
          sudo systemctl restart nginx 2>/dev/null || systemctl restart nginx 2>/dev/null || true

          echo "=== Step 14: Ensure PostgreSQL & Redis are running ==="
          (sudo systemctl enable postgresql redis-server 2>/dev/null && sudo systemctl start postgresql redis-server 2>/dev/null) || \
          (sudo systemctl enable postgresql redis 2>/dev/null && sudo systemctl start postgresql redis 2>/dev/null) || \
          (systemctl enable postgresql redis-server 2>/dev/null && systemctl start postgresql redis-server 2>/dev/null) || \
          true

          echo "=== Waiting for services to start... ==="
          sleep 8

          echo "=== Service status ==="
          (sudo systemctl --no-pager is-active sdics-gunicorn 2>/dev/null || systemctl --no-pager is-active sdics-gunicorn 2>/dev/null) && echo "  sdics-gunicorn: active" || echo "  sdics-gunicorn: INACTIVE (check journalctl -u sdics-gunicorn)"
          (sudo systemctl --no-pager is-active sdics-daphne 2>/dev/null || systemctl --no-pager is-active sdics-daphne 2>/dev/null) && echo "  sdics-daphne: active" || echo "  sdics-daphne: INACTIVE (optional - for WebSockets only)"
          (sudo systemctl --no-pager is-active nginx 2>/dev/null || systemctl --no-pager is-active nginx 2>/dev/null) && echo "  nginx: active" || echo "  nginx: INACTIVE"

          echo "=== Health checks ==="
          curl -sf http://127.0.0.1/health 2>/dev/null && echo "  ✅ Nginx health OK" || echo "  ⚠️  Nginx health check"
          (sudo -u postgres pg_isready 2>/dev/null || su postgres -c pg_isready 2>/dev/null) && echo "  ✅ PostgreSQL running" || echo "  ⚠️  PostgreSQL status"
          redis-cli ping 2>/dev/null | grep -q PONG && echo "  ✅ Redis running" || echo "  ⚠️  Redis status"

          echo ""
          echo "✅ Deployment complete!"

          REMOTESERVER

      - name: Cleanup
        if: always()
        run: rm -rf ~/.ssh/id_rsa

      - name: Notify success
        if: success()
        run: echo "✅ Deployment successful to ${{ env.DEPLOY_HOST }}"

      - name: Notify failure
        if: failure()
        run: echo "❌ Deployment failed - check logs above"
