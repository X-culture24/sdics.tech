name: Build and Deploy

on:
  push:
    branches:
      - main

jobs:
  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'
      
      - name: Build frontend
        run: |
          cd frontend
          npm ci
          npm run build
      
      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 1

  deploy:
    runs-on: ubuntu-latest
    needs: build-frontend
    steps:
      - uses: actions/checkout@v4
      
      - name: Download frontend artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
      
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts
      
      - name: Prepare deployment
        run: |
          # Create temporary tar with backend + pre-built frontend
          tar czf deploy.tar.gz \
            core/ \
            sdics/ \
            manage.py \
            requirements.txt \
            nginx.conf \
            frontend/dist \
            --exclude=__pycache__ \
            --exclude=*.pyc \
            --exclude=node_modules
      
      - name: Deploy to server
        run: |
          scp deploy.tar.gz root@${{ secrets.DEPLOY_HOST }}:/tmp/
          
          ssh root@${{ secrets.DEPLOY_HOST }} << 'EOF'
          set -e
          cd /root/sdics.tech
          
          # Extract only backend and pre-built frontend (skip npm install entirely)
          tar xzf /tmp/deploy.tar.gz
          
          # Python setup
          python3 -m venv venv || true
          source venv/bin/activate
          pip install -q -r requirements.txt
          
          # Django (no npm build needed)
          python manage.py migrate
          python manage.py collectstatic --noinput
          python manage.py create_admin
          
          # Restart services
          systemctl restart gunicorn || true
          systemctl restart nginx || true
          
          # Cleanup
          rm /tmp/deploy.tar.gz
          
          echo "Deployment completed successfully"
          EOF
          
          rm deploy.tar.gz
